<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>口算大冒险 · 自动跳转完整版</title>
    <style>
        :root {
            --primary: #4A90D9;
            --success: #27AE60;
            --danger: #E74C3C;
            --warning: #F39C12;
            --bg: #f0f4f8;
            --card-bg: #ffffff;
            --text: #2c3e50;
            --border: #e1e8ef;
            --safe-bottom: env(safe-area-inset-bottom, 16px);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(145deg, #e8eef5, #dce6f1);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 12px; user-select: none; -webkit-user-select: none;
        }
        .container {
            width: 100%; max-width: 500px; max-height: 100vh; background: var(--card-bg);
            border-radius: 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.08);
            overflow: hidden; display: flex; flex-direction: column; position: relative;
        }
        .view { display: none; flex-direction: column; flex: 1; overflow-y: auto;
            padding: 20px 18px; padding-bottom: calc(20px + var(--safe-bottom)); animation: fadeIn 0.3s ease; }
        .view.active { display: flex; }
        @keyframes fadeIn { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: translateY(0); } }

        .title-area { text-align: center; margin-bottom: 8px; }
        .icon { font-size: 2.4rem; } .title { font-size: 1.5rem; font-weight: 800; } .sub { font-size: 0.8rem; color: #888; }
        .mode-switch { display: flex; gap: 8px; background: #f0f2f5; border-radius: 30px; padding: 4px; margin: 12px 0; }
        .mode-btn { flex:1; padding: 10px; border-radius: 26px; border:none; font-weight: 700; font-size: 0.9rem; background: transparent; color: #999; cursor: pointer; }
        .mode-btn.active { background: linear-gradient(135deg, #4A90D9, #5DADE2); color:#fff; box-shadow: 0 4px 15px rgba(74,144,217,0.35); }
        .section-label { font-weight: 700; margin: 10px 0 6px; font-size: 0.9rem; }
        .quick-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
        .quick-btn { padding: 6px 13px; border-radius: 18px; border:1.5px solid #dde; background:#fff; font-size:0.78rem; font-weight:600; cursor:pointer; }
        .type-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap:7px; margin-bottom:8px; }
        .type-chip { padding:8px 4px; border-radius:18px; border:2px solid var(--border); font-size:0.78rem; font-weight:600; background:#fafcfd; cursor:pointer; text-align:center; }
        .type-chip.selected { border-color: var(--primary); background:#eef6fd; font-weight:700; }
        .timer-row, .count-row { display: flex; gap:7px; flex-wrap:wrap; margin-bottom:8px; }
        .opt-btn { padding:7px 14px; border-radius:22px; border:2px solid var(--border); background:#fff; font-weight:600; cursor:pointer; font-size:0.82rem; color:#666; }
        .opt-btn.active { border-color: var(--warning); background:#fffdf5; color:#d68910; }
        .adventure-info { margin:10px 0; padding:10px 14px; background:#fef9e7; border-radius:14px; text-align:center; font-size:0.85rem; color:#b7950b; }
        .entry-buttons { display: flex; gap: 12px; margin: 20px 0; }
        .entry-btn { flex:1; padding: 14px 10px; border-radius: 30px; font-weight: 700; font-size: 0.85rem; border: none; cursor: pointer; background: #f0f2f5; color: #666; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .entry-btn.wrong { background: #fff0e0; border: 2px solid #f0c78e; color: #b87333; }
        .entry-btn.weak { background: #e8f2fe; border: 2px solid #a0c4ff; color: #2a5a8c; }
        .start-btn { width:100%; padding:14px; border-radius:50px; background: linear-gradient(135deg, #4A90D9, #5DADE2); color:#fff; font-size:1.2rem; font-weight:700; border:none; cursor:pointer; margin-top:15px; }

        .practice-inner { display: flex; flex-direction: column; flex:1; gap:10px; }
        .header-bar { display: flex; align-items: center; justify-content: space-between; }
        .level-tag { background: #FFD700; padding:5px 12px; border-radius:16px; font-weight:800; font-size:0.8rem; }
        .question-card { background: #fafcfd; border-radius:18px; padding:16px; border:2px solid var(--border); text-align:center; }
        .question-text { font-size: 2rem; font-weight:800; margin:4px 0; }
        .timer-ring-wrap { width:56px; height:56px; margin:8px auto 0; position:relative; }
        .ring-svg { transform: rotate(-90deg); width:100%; height:100%; }
        .ring-bg { fill:none; stroke:#eee; stroke-width:5; }
        .ring-fg { fill:none; stroke:#27AE60; stroke-width:5; stroke-linecap:round; transition: 0.1s linear; }
        .timer-num { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:1.2rem; font-weight:800; }
        .answer-input {
            flex:1; padding:12px 16px; border-radius:25px; border:3px solid var(--border);
            font-size:1.3rem; text-align:center; font-weight:700; outline:none;
        }
        .answer-input.correct { border-color:#27AE60 !important; background:#eafaf1; }
        .answer-input.wrong { border-color:#E74C3C !important; background:#fdedec; }
        .bottom-actions { display: flex; gap: 8px; margin-top: 4px; }
        .btn-bottom { padding: 12px 10px; border-radius: 25px; font-weight: 700; border: none; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 4px; }
        .btn-pause-bottom { flex:1; background:#fff; border:2px solid #ddd; color:#888; }
        .btn-submit-bottom { flex:2; background: linear-gradient(135deg, #4A90D9, #5DADE2); color:#fff; }
        .btn-skip-bottom { flex:1; background:#fff; border:2px solid #ddd; color:#888; }
        .btn-bottom:active { transform: scale(0.95); }
        .btn-submit-bottom:disabled { background: #c0c8d4; box-shadow: none; }

        .pause-overlay { position:absolute; inset:0; background: rgba(255,255,255,0.92); backdrop-filter: blur(6px); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:100; border-radius:24px; }
        .pause-overlay.hidden { display: none; }
        .pause-overlay .btn-resume { padding: 12px 40px; border-radius:30px; background:#27AE60; color:#fff; font-weight:700; border:none; margin: 12px 0; }

        .result-header { text-align:center; margin-bottom:12px; }
        .result-emoji { font-size:3.5rem; }
        .stats-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:10px 0; }
        .stat-card { background:#f8fafc; border-radius:14px; padding:12px; text-align:center; border:1px solid var(--border); }
        .stat-card .val { font-size:1.4rem; font-weight:800; }
        .wrong-retry { color: #E74C3C; text-decoration: underline; cursor: pointer; font-weight: 800; }
        .btn-back { width:100%; padding:11px; border-radius:28px; background:#fff; border:2px solid #ddd; margin-top:6px; }
    </style>
</head>
<body>
<div class="container" id="app">
    <div class="view active" id="homeView">
        <div class="title-area"><span class="icon">🧮</span><h1>口算大冒险</h1><div class="sub">三年级 · 智能学习版</div></div>
        <div class="mode-switch">
            <button class="mode-btn active" data-mode="free">📋 自由练习</button>
            <button class="mode-btn" data-mode="adventure">🏰 闯关模式</button>
        </div>
        <div id="freeOptions">
            <div class="section-label">📌 选择题型</div>
            <div class="quick-row">
                <button class="quick-btn" data-preset="basic">📐 基础</button>
                <button class="quick-btn" data-preset="advanced">🚀 进阶</button>
                <button class="quick-btn" data-preset="all">🌟 全部</button>
                <button class="quick-btn" data-preset="none">❌ 清空</button>
            </div>
            <div class="type-grid" id="typeGrid"></div>
            <div class="section-label">⏱️ 倒计时</div>
            <div class="timer-row" id="timerOptions">
                <button class="opt-btn" data-time="3">3秒</button>
                <button class="opt-btn active" data-time="10">10秒</button>
                <button class="opt-btn" data-time="15">15秒</button>
                <button class="opt-btn" data-time="20">20秒</button>
                <button class="opt-btn" data-time="30">30秒</button>
            </div>
            <div class="section-label">📝 题量</div>
            <div class="count-row" id="countOptions">
                <button class="opt-btn active" data-count="20">20题</button>
                <button class="opt-btn" data-count="50">50题</button>
                <button class="opt-btn" data-count="100">100题</button>
            </div>
        </div>
        <div id="adventureInfo" class="adventure-info" style="display:none;">🗺️ 6关冒险，正确率80%晋级</div>
        <div class="entry-buttons">
            <button class="entry-btn wrong" id="btnWrongBook">📕 错题本</button>
            <button class="entry-btn weak" id="btnWeakAttack">🎯 弱点攻破</button>
        </div>
        <button class="start-btn" id="btnStart">🚀 开始练习</button>
    </div>

    <div class="view" id="practiceView">
        <div class="practice-inner">
            <div class="header-bar">
                <span class="level-tag" id="levelTag" style="display:none;">第1关</span>
                <span class="progress-text" id="progressText">1/20</span>
                <span class="score-inline">⭐ <span id="liveStars">0</span></span>
            </div>
            <div class="question-card" id="questionCard">
                <span class="question-type-tag" id="questionTypeTag">加法</span>
                <div class="question-text" id="questionText">3 + 5 = ?</div>
                <div class="timer-ring-wrap">
                    <svg class="ring-svg" viewBox="0 0 100 100">
                        <circle class="ring-bg" cx="50" cy="50" r="42"/>
                        <circle class="ring-fg" id="ringFg" cx="50" cy="50" r="42" stroke-dasharray="263.89" stroke-dashoffset="0"/>
                    </svg>
                    <span class="timer-num" id="timerNum">10</span>
                </div>
            </div>
            <div class="answer-row"><input type="text" inputmode="numeric" class="answer-input" id="answerInput" placeholder="输入答案" autocomplete="off"></div>
            <div class="bottom-actions">
                <button class="btn-bottom btn-pause-bottom" id="btnPause">⏸️ 暂停</button>
                <button class="btn-bottom btn-submit-bottom" id="btnSubmit">✅ 确定</button>
                <button class="btn-bottom btn-skip-bottom" id="btnSkip">⏭ 跳过</button>
            </div>
        </div>
        <div class="pause-overlay hidden" id="pauseOverlay">
            <div class="pause-icon">⏸️</div>
            <div style="font-weight:700; font-size:1.2rem; margin-bottom:6px;">已暂停</div>
            <button class="btn-resume" id="btnResume">▶️ 继续</button>
            <button class="btn-quit" id="btnQuitPause">🚪 退出</button>
        </div>
    </div>

    <div class="view" id="resultView">
        <div class="result-header">
            <div class="result-emoji" id="resultEmoji">🎉</div>
            <div class="result-stars" id="resultStars">⭐⭐⭐</div>
            <h2 id="resultMsg">非常棒！</h2>
            <p style="color:#888; font-size:0.85rem; margin-top:6px;" id="suggestionText"></p>
        </div>
        <div class="stats-grid">
            <div class="stat-card"><div class="val green" id="correctNum">0</div><div class="lbl">正确</div></div>
            <div class="stat-card" id="wrongCard">
                <div class="val red" id="wrongNum">0</div>
                <div class="lbl">错误 (点击重做)</div>
            </div>
            <div class="stat-card"><div class="val" id="accuracy">0%</div><div class="lbl">正确率</div></div>
            <div class="stat-card"><div class="val" id="avgTime">0s</div><div class="lbl">平均用时</div></div>
        </div>
        <button class="btn-next" id="btnNext">继续 ➡️</button>
        <button class="btn-back" id="btnBackHome">🏠 返回主页</button>
    </div>

    <div class="view" id="wrongBookView">
        <h2 style="margin-bottom:16px;">📕 错题本</h2>
        <div id="wrongTypeList"></div>
        <button class="btn-back" id="btnWrongBack">返回主页</button>
    </div>
</div>

<script>
    (function() {
        const typeDefs = [
            { id: 'add1', name: '一位数加法', icon: '➕', gen: () => { let a = rand(1,9), b = rand(1,9); return { text: `${a}+${b}=?`, ans: a+b }; } },
            { id: 'add2', name: '两位数加法', icon: '➕', gen: () => { let a = rand(10,99), b = rand(1,99); if(a+b>200) b=rand(1,200-a); return { text: `${a}+${b}=?`, ans: a+b }; } },
            { id: 'sub1', name: '一位数减法', icon: '➖', gen: () => { let a = rand(2,9), b = rand(1,a); return { text: `${a}-${b}=?`, ans: a-b }; } },
            { id: 'sub2', name: '两位数减法', icon: '➖', gen: () => { let a = rand(10,99), b = rand(1,a); return { text: `${a}-${b}=?`, ans: a-b }; } },
            { id: 'mul1', name: '一位数乘法', icon: '✖️', gen: () => { let a = rand(1,9), b = rand(1,9); return { text: `${a}×${b}=?`, ans: a*b }; } },
            { id: 'mul2', name: '两位数×一位数', icon: '✖️', gen: () => { let a = rand(10,99), b = rand(2,9); return { text: `${a}×${b}=?`, ans: a*b }; } },
            { id: 'div1', name: '一位数除法', icon: '➗', gen: () => { let b = rand(2,9), c = rand(1,9); return { text: `${b*c}÷${b}=?`, ans: c }; } },
            { id: 'div2', name: '两位数除法', icon: '➗', gen: () => { let b = rand(2,9), c = rand(2, Math.floor(99/b)); return { text: `${b*c}÷${b}=?`, ans: c }; } },
            { id: 'sq1', name: '一位数平方', icon: '²', gen: () => { let a = rand(1,9); return { text: `${a}²=?`, ans: a*a }; } },
            { id: 'sq2', name: '两位数平方', icon: '²', gen: () => { let a = rand(10,25); return { text: `${a}²=?`, ans: a*a }; } },
        ];

        function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

        const STORAGE_KEY = 'math_adventure_data';
        function loadData() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || { wrongBook:{}, typeStats:{}, adventureLevel:0 }; } catch(e) { return { wrongBook:{}, typeStats:{}, adventureLevel:0 }; } }
        function saveData(data) { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

        function addWrongRecord(typeId, question, correctAns, userAns, timeSpent) {
            const data = loadData();
            if (!data.wrongBook[typeId]) data.wrongBook[typeId] = [];
            data.wrongBook[typeId].push({ question, correctAnswer: correctAns, userAnswer: userAns, timeSpent, timestamp: Date.now() });
            if (data.wrongBook[typeId].length > 200) data.wrongBook[typeId].shift();
            saveData(data);
        }

        function updateTypeStats(typeId, isCorrect, timeSpent) {
            const data = loadData();
            if (!data.typeStats[typeId]) data.typeStats[typeId] = { totalCount:0, correctCount:0, totalTime:0, lastPractice:0 };
            const s = data.typeStats[typeId];
            s.totalCount++; if(isCorrect) s.correctCount++; s.totalTime += timeSpent; s.lastPractice = Date.now();
            saveData(data);
        }

        function getWeakTypes() {
            const data = loadData(); const weak = [];
            for (let id in data.typeStats) {
                const s = data.typeStats[id];
                if (s.totalCount >= 5 && (1 - s.correctCount/s.totalCount) > 0.3) weak.push({ id, errorRate: 1 - s.correctCount/s.totalCount });
            }
            return weak.sort((a,b)=>b.errorRate-a.errorRate).map(w=>w.id);
        }

        function getRecentWrongTypes(days=30) {
            const data = loadData(); const now = Date.now(); const threshold = days*24*3600*1000; const countMap = {};
            for (let id in data.wrongBook) {
                const recent = data.wrongBook[id].filter(r => now - r.timestamp < threshold);
                if (recent.length > 0) countMap[id] = recent.length;
            }
            return Object.entries(countMap).sort((a,b)=>b[1]-a[1]).map(e=>e[0]);
        }

        let mode = 'free', selectedTypes = new Set(['add1','add2','sub1','mul1','div1']);
        let timerSec = 10, questionCount = 20, currentLevel = 0;
        const levels = [
            { name:'第1关·加法', types:['add1','add2'], time:15, count:10, pass:0.8 },
            { name:'第2关·减法', types:['sub1','sub2'], time:12, count:15, pass:0.8 },
            { name:'第3关·乘法', types:['mul1'], time:10, count:20, pass:0.85 },
            { name:'第4关·除法', types:['div1','div2'], time:12, count:20, pass:0.85 },
            { name:'第5关·混合', types:['add1','sub1','mul1','div1'], time:10, count:25, pass:0.8 },
            { name:'第6关·终极', types:['add2','sub2','mul2','sq1','sq2'], time:8, count:30, pass:0.9 },
        ];
        let questions = [], currentIdx = 0, correctCount = 0, wrongCount = 0;
        let totalTime = 0, timerInterval = null, questionStart = 0, answered = false;
        let starsInLevel = 0, isPaused = false, currentRoundResults = [];

        const $ = id => document.getElementById(id);
        const views = { home: $('homeView'), practice: $('practiceView'), result: $('resultView'), wrongBook: $('wrongBookView') };
        function showView(view) { Object.values(views).forEach(v => v.classList.remove('active')); view.classList.add('active'); }

        function initHome() {
            document.querySelectorAll('.mode-btn').forEach(b => b.addEventListener('click', function() {
                document.querySelectorAll('.mode-btn').forEach(x => x.classList.remove('active'));
                this.classList.add('active');
                mode = this.dataset.mode;
                $('freeOptions').style.display = mode==='free'?'':'none';
                $('adventureInfo').style.display = mode==='adventure'?'block':'none';
                updateStartBtn();
            }));
            const grid = $('typeGrid');
            typeDefs.forEach(t => {
                const chip = document.createElement('div');
                chip.className = 'type-chip' + (selectedTypes.has(t.id)?' selected':'');
                chip.textContent = t.icon + ' ' + t.name; chip.dataset.id = t.id;
                chip.addEventListener('click', () => {
                    if (selectedTypes.has(t.id)) selectedTypes.delete(t.id); else selectedTypes.add(t.id);
                    chip.classList.toggle('selected'); updateStartBtn();
                });
                grid.appendChild(chip);
            });
            document.querySelectorAll('.quick-btn').forEach(b => b.addEventListener('click', function() {
                const preset = this.dataset.preset;
                if (preset === 'basic') selectedTypes = new Set(['add1','add2','sub1','sub2','mul1','div1']);
                else if (preset === 'advanced') selectedTypes = new Set(['mul2','div2','sq1','sq2']);
                else if (preset === 'all') selectedTypes = new Set(typeDefs.map(t=>t.id));
                else selectedTypes = new Set();
                document.querySelectorAll('#typeGrid .type-chip').forEach(c => c.classList.toggle('selected', selectedTypes.has(c.dataset.id)));
                updateStartBtn();
            }));
            document.querySelectorAll('#timerOptions .opt-btn').forEach(b => b.addEventListener('click', function() {
                document.querySelectorAll('#timerOptions .opt-btn').forEach(x=>x.classList.remove('active'));
                this.classList.add('active'); timerSec = parseInt(this.dataset.time);
            }));
            document.querySelectorAll('#countOptions .opt-btn').forEach(b => b.addEventListener('click', function() {
                document.querySelectorAll('#countOptions .opt-btn').forEach(x=>x.classList.remove('active'));
                this.classList.add('active'); questionCount = parseInt(this.dataset.count);
            }));
            $('btnStart').addEventListener('click', startNormalGame);
            $('btnWrongBook').addEventListener('click', openWrongBook);
            $('btnWeakAttack').addEventListener('click', startWeakAttack);
            updateStartBtn();
        }

        function updateStartBtn() {
            const btn = $('btnStart');
            if (mode==='free' && selectedTypes.size===0) { btn.disabled = true; btn.textContent = '⚠️ 请选择题型'; }
            else { btn.disabled = false; btn.textContent = '🚀 开始练习'; }
        }

        function startNormalGame() {
            if (mode === 'adventure') { currentLevel = loadData().adventureLevel || 0; startAdventureLevel(currentLevel); }
            else { prepareQuestions(Array.from(selectedTypes), questionCount, 'free'); startRound(); }
        }
        function startAdventureLevel(level) {
            const lv = levels[level]; timerSec = lv.time; questionCount = lv.count;
            prepareQuestions(lv.types, lv.count, 'adventure');
            $('levelTag').style.display='inline-block'; $('levelTag').textContent = lv.name;
            startRound();
        }
        function startWeakAttack() {
            let types = getWeakTypes();
            if (types.length === 0) types = getRecentWrongTypes(30);
            if (types.length === 0) { alert('暂无薄弱数据，请先练习。'); return; }
            prepareQuestions(types.slice(0,5), 20, 'weak'); startRound();
        }
        function openWrongBook() {
            const data = loadData(); const container = $('wrongTypeList'); container.innerHTML = '';
            const typeNames = {}; typeDefs.forEach(t => typeNames[t.id]=t.name);
            let hasWrong = false;
            for (let id in data.wrongBook) {
                if (data.wrongBook[id].length > 0) {
                    hasWrong = true;
                    const div = document.createElement('div'); div.className = 'list-item';
                    div.innerHTML = `<span>${typeNames[id]||id} (${data.wrongBook[id].length}题)</span><button class="opt-btn" data-type="${id}">练习此题型</button>`;
                    div.querySelector('button').addEventListener('click', () => { prepareQuestions([id], 20, 'wrong'); startRound(); });
                    container.appendChild(div);
                }
            }
            if (!hasWrong) container.innerHTML = '<p style="text-align:center;color:#888;">暂无错题，继续加油！</p>';
            $('btnWrongBack').onclick = () => showView(views.home);
            showView(views.wrongBook);
        }

        function prepareQuestions(typeIds, count, sourceMode) {
            const pool = [];
            for (let i=0; i<count; i++) {
                const id = typeIds[rand(0, typeIds.length-1)];
                const t = typeDefs.find(t=>t.id===id);
                const q = t.gen(); q.typeId = id; q.typeName = t.name; pool.push(q);
            }
            questions = pool; mode = sourceMode;
            currentIdx = 0; correctCount = 0; wrongCount = 0; totalTime = 0; starsInLevel = 0;
            currentRoundResults = [];
        }

        function startRound() {
            answered = false; isPaused = false;
            $('pauseOverlay').classList.add('hidden'); showView(views.practice);
            updatePracticeStats(); loadQuestion();
        }

        function loadQuestion() {
            if (currentIdx >= questions.length) { finishRound(); return; }
            answered = false; isPaused = false;
            const q = questions[currentIdx];
            $('questionText').textContent = q.text; $('questionTypeTag').textContent = q.typeName;
            $('answerInput').value = ''; $('answerInput').disabled = false; $('answerInput').className = 'answer-input';
            $('btnSubmit').disabled = false; $('questionCard').className = 'question-card';
            $('ringFg').style.strokeDashoffset = '0'; $('ringFg').style.stroke = '#27AE60';
            $('timerNum').textContent = timerSec; updatePracticeStats();
            startTimer(); questionStart = Date.now(); $('answerInput').focus();
        }

        function startTimer() {
            clearInterval(timerInterval); let remaining = timerSec; const totalMs = timerSec*1000; const startTs = Date.now();
            timerInterval = setInterval(() => {
                if (isPaused) return;
                const elapsed = Date.now()-startTs; const left = Math.max(0, totalMs-elapsed);
                const fraction = left/totalMs; const sec = Math.ceil(left/1000);
                $('ringFg').style.strokeDashoffset = (263.89*(1-fraction)).toFixed(2);
                $('timerNum').textContent = sec;
                if (fraction <= 0.2) $('ringFg').style.stroke = '#E74C3C';
                else if (fraction <= 0.45) $('ringFg').style.stroke = '#F39C12';
                if (left <= 0) handleTimeout();
            }, 100);
        }

        function stopTimer() { clearInterval(timerInterval); timerInterval = null; }

        function handleTimeout() {
            if (answered) return; answered = true; stopTimer();
            const q = questions[currentIdx]; wrongCount++; totalTime += timerSec;
            currentRoundResults.push({ typeId: q.typeId, correct: false, time: timerSec });
            $('questionCard').className = 'question-card timeout';
            $('answerInput').disabled = true; $('btnSubmit').disabled = true;
            updatePracticeStats();
            setTimeout(() => { currentIdx++; loadQuestion(); }, 1200);
        }

        // ★ 手动确定按钮（备用）
        function submitAnswer() {
            if (answered || isPaused) return;
            const input = $('answerInput'); const val = parseInt(input.value.trim());
            if (isNaN(val)) { input.classList.add('wrong'); setTimeout(()=>input.classList.remove('wrong'),400); return; }
            processAnswer(val);
        }

        // 统一处理答案（由自动检测或手动确定调用）
        function processAnswer(val) {
            if (answered) return;
            answered = true; stopTimer();
            const elapsed = (Date.now()-questionStart)/1000; const timeUsed = Math.min(elapsed, timerSec);
            totalTime += timeUsed;
            const q = questions[currentIdx]; const isCorrect = (val === q.ans);

            if (isCorrect) {
                correctCount++; if (mode==='adventure') starsInLevel++;
                $('questionCard').className = 'question-card correct';
                $('answerInput').className = 'answer-input correct';
                updateTypeStats(q.typeId, true, timeUsed);
                currentRoundResults.push({ typeId: q.typeId, correct: true, time: timeUsed });
            } else {
                wrongCount++;
                $('questionCard').className = 'question-card wrong';
                $('answerInput').className = 'answer-input wrong';
                addWrongRecord(q.typeId, q.text, q.ans, val, timeUsed);
                updateTypeStats(q.typeId, false, timeUsed);
                currentRoundResults.push({ typeId: q.typeId, correct: false, time: timeUsed });
            }
            $('answerInput').disabled = true;
            $('btnSubmit').disabled = true;
            updatePracticeStats();

            // 跳转延迟：正确立即，错误稍慢
            const delay = isCorrect ? 200 : 1000;
            setTimeout(() => {
                currentIdx++;
                loadQuestion();
            }, delay);
        }

        // ★ 实时监测输入，正确答案自动触发
        $('answerInput').addEventListener('input', function() {
            if (answered || isPaused) return;
            const val = parseInt(this.value.trim());
            if (isNaN(val)) return;
            if (val === questions[currentIdx].ans) {
                processAnswer(val);
            }
        });

        function skipQuestion() {
            if (answered || isPaused) return;
            answered = true; stopTimer();
            const elapsed = (Date.now()-questionStart)/1000; const timeUsed = Math.min(elapsed, timerSec);
            totalTime += timeUsed;
            const q = questions[currentIdx]; wrongCount++;
            addWrongRecord(q.typeId, q.text, q.ans, '跳过', timeUsed);
            updateTypeStats(q.typeId, false, timeUsed);
            currentRoundResults.push({ typeId: q.typeId, correct: false, time: timeUsed });
            $('questionCard').className = 'question-card wrong';
            $('answerInput').disabled = true; $('btnSubmit').disabled = true;
            updatePracticeStats();
            setTimeout(() => { currentIdx++; loadQuestion(); }, 800);
        }

        function updatePracticeStats() {
            $('progressText').textContent = `${Math.min(currentIdx+(answered?1:0), questions.length)}/${questions.length}`;
            $('liveStars').textContent = mode==='adventure'? starsInLevel : correctCount;
        }

        function togglePause() {
            if (answered) return;
            if (!isPaused) { isPaused=true; stopTimer(); $('pauseOverlay').classList.remove('hidden'); }
            else { isPaused=false; $('pauseOverlay').classList.add('hidden'); restartTimer(parseInt($('timerNum').textContent)||timerSec); $('answerInput').focus(); }
        }

        function restartTimer(remSec) {
            clearInterval(timerInterval); const totalMs = remSec*1000; const startTs = Date.now();
            timerInterval = setInterval(() => {
                if (isPaused) return;
                const elapsed = Date.now()-startTs; const left = Math.max(0, totalMs-elapsed);
                $('ringFg').style.strokeDashoffset = (263.89*(1-left/totalMs)).toFixed(2);
                $('timerNum').textContent = Math.ceil(left/1000);
                if (left/totalMs <= 0.2) $('ringFg').style.stroke = '#E74C3C';
                else if (left/totalMs <= 0.45) $('ringFg').style.stroke = '#F39C12';
                if (left <= 0) handleTimeout();
            }, 100);
        }

        function finishRound() {
            stopTimer(); isPaused = false;
            $('pauseOverlay').classList.add('hidden');
            const total = questions.length; const acc = total>0 ? correctCount/total : 0;
            const avg = total>0 ? (totalTime/total).toFixed(1) : 0;
            $('correctNum').textContent = correctCount; $('wrongNum').textContent = wrongCount;
            $('accuracy').textContent = Math.round(acc*100)+'%'; $('avgTime').textContent = avg+'s';

            const wrongCard = $('wrongCard');
            wrongCard.onclick = null;
            if (wrongCount > 0) {
                const wrongTypeIds = currentRoundResults.filter(r => !r.correct).map(r => r.typeId);
                if (wrongTypeIds.length > 0) {
                    wrongCard.style.cursor = 'pointer';
                    wrongCard.querySelector('.val').classList.add('wrong-retry');
                    wrongCard.onclick = () => {
                        const cnt = Math.max(wrongTypeIds.length, 5);
                        prepareQuestions(wrongTypeIds, cnt, 'retry');
                        startRound();
                    };
                }
            } else {
                wrongCard.style.cursor = 'default';
                wrongCard.querySelector('.val').classList.remove('wrong-retry');
            }

            if (mode === 'adventure') {
                const lv = levels[currentLevel]; const passed = acc >= lv.pass;
                if (passed) {
                    const data = loadData(); data.adventureLevel = Math.min(currentLevel+1, levels.length-1); saveData(data);
                    $('resultEmoji').textContent='🏆'; $('resultStars').textContent='⭐⭐⭐'; $('resultMsg').textContent=`通过 ${lv.name}！`;
                } else {
                    $('resultEmoji').textContent='😞'; $('resultStars').textContent='⭐'; $('resultMsg').textContent='再试一次';
                }
                $('btnNext').style.display = (passed && currentLevel<levels.length-1)?'block':'none';
                $('btnNext').textContent = '下一关';
                $('btnNext').onclick = () => {
                    if (passed && currentLevel<levels.length-1) { currentLevel++; startAdventureLevel(currentLevel); }
                    else startAdventureLevel(currentLevel);
                };
            } else {
                $('resultEmoji').textContent = acc>=0.9?'🏆':'👍';
                $('resultStars').textContent = acc>=0.9?'⭐⭐⭐':acc>=0.7?'⭐⭐':'⭐';
                $('resultMsg').textContent = acc>=0.9?'非常棒！':'继续加油！';
                $('btnNext').style.display = 'none';
            }

            const weak = getWeakTypes(); const weakNames = weak.map(id => typeDefs.find(t=>t.id===id)?.name||'').filter(Boolean);
            $('suggestionText').textContent = weakNames.length>0 ? `💡 建议加强：${weakNames.join('、')}` : '';

            $('btnBackHome').onclick = () => { showView(views.home); updateStartBtn(); };
            showView(views.result);
        }

        // 事件绑定
        $('btnSubmit').addEventListener('click', submitAnswer);
        $('btnSkip').addEventListener('click', skipQuestion);
        $('btnPause').addEventListener('click', togglePause);
        $('btnResume').addEventListener('click', togglePause);
        $('btnQuitPause').addEventListener('click', () => {
            if (confirm('确定退出吗？')) { stopTimer(); isPaused=false; $('pauseOverlay').classList.add('hidden'); showView(views.home); updateStartBtn(); }
        });
        $('answerInput').addEventListener('keydown', e => { if (e.key==='Enter') { e.preventDefault(); submitAnswer(); } });

        initHome(); showView(views.home);
    })();
</script>
</body>
</html>
